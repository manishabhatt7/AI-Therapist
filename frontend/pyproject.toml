[project]
name = "frontend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.0.0",
    "gTTS>=2.5.0",
    "groq>=0.9.0",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "python-jose>=3.5.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0.49",
    "streamlit>=1.65.0",
]

[project.scripts]
frontend = "frontend:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
